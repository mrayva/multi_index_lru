name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 11 / Boost 1.74
            runner: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
            packages: g++-11 libboost1.74-dev
            boost_develop: "OFF"
            boost_tag: develop
          - name: Clang 14 / Boost 1.74
            runner: ubuntu-22.04
            cc: clang-14
            cxx: clang++-14
            packages: clang-14 libboost1.74-dev
            boost_develop: "OFF"
            boost_tag: develop
          - name: GCC 13 / Boost 1.83
            runner: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            packages: g++-13 libboost1.83-dev
            boost_develop: "OFF"
            boost_tag: develop
          - name: Clang 18 / Boost 1.83
            runner: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libboost1.83-dev
            boost_develop: "OFF"
            boost_tag: develop
          - name: GCC 13 / Boost 1.91
            runner: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            packages: g++-13
            boost_develop: "ON"
            boost_tag: boost-1.91.0

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build ${{ matrix.packages }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMULTI_INDEX_LRU_BUILD_TESTS=ON
          -DMULTI_INDEX_LRU_BUILD_EXAMPLES=ON
          -DMULTI_INDEX_LRU_USE_BOOST_DEVELOP=${{ matrix.boost_develop }}
          -DMULTI_INDEX_LRU_BOOST_GIT_TAG=${{ matrix.boost_tag }}
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  boost-develop:
    name: Clang 18 / Boost develop
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 ninja-build

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMULTI_INDEX_LRU_BUILD_TESTS=ON
          -DMULTI_INDEX_LRU_BUILD_EXAMPLES=ON
          -DMULTI_INDEX_LRU_USE_BOOST_DEVELOP=ON
          -DMULTI_INDEX_LRU_BOOST_GIT_TAG=develop
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sbepp-integration:
    name: sbepp 1.8.0 integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Pin the commit behind the annotated 1.8.0 tag so sbeppc and the
      # header-only runtime always come from exactly the same revision.
      - uses: actions/checkout@v5
        with:
          repository: OleksandrKvl/sbepp
          ref: 4185f7e37b9ae29d30c1e384a7f31d7c31d3f5e8
          path: _deps/sbepp

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++-13 libboost1.83-dev libfmt-dev libpugixml-dev ninja-build

      - name: Build and install pinned sbepp
        run: |
          cmake -S _deps/sbepp -B _build/sbepp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/_install/sbepp" \
            -DSBEPP_BUILD_SBEPPC=ON \
            -DSBEPP_BUILD_TESTS=OFF
          cmake --build _build/sbepp --parallel 2
          cmake --install _build/sbepp

      - name: Generate market-cache schema
        run: |
          _install/sbepp/bin/sbeppc \
            --output-dir "$GITHUB_WORKSPACE/_generated/sbepp" \
            example/schemas/market_cache.xml
          test -f _generated/sbepp/market_cache/messages/quote.hpp

      - name: Configure integration example
        env:
          CC: gcc-13
          CXX: g++-13
        run: >-
          cmake -S . -B _build/integration -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_install/sbepp"
          -DMULTI_INDEX_LRU_BUILD_TESTS=OFF
          -DMULTI_INDEX_LRU_BUILD_EXAMPLES=ON
          -DMULTI_INDEX_LRU_BUILD_SBEPP_EXAMPLE=ON
          -DMULTI_INDEX_LRU_SBEPP_GENERATED_DIR="$GITHUB_WORKSPACE/_generated/sbepp"
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build and run integration example
        run: |
          cmake --build _build/integration --target sbepp_cache --parallel 2
          _build/integration/example/sbepp_cache

  poc-unit-tests:
    name: iceoryx2 POC unit tests (wire.hpp + handle_request_local + config)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # example/iceoryx2_cache_poc/ as a whole depends on iceoryx2-cxx (Rust
      # toolchain to build) and, optionally, nats_asio's own heavy dependency
      # tree -- deliberately not part of this repo's normal CI. wire.hpp,
      # handle_request_local() (cache_service.hpp), and config.hpp have no
      # dependency on either, though, so POC_BUILD_ICEORYX2_TARGETS=OFF
      # configures and builds their unit tests with nothing but Boost and a
      # C++20 compiler.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++-13 libboost1.83-dev ninja-build

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: >-
          cmake -S example/iceoryx2_cache_poc -B _build/poc-tests -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPOC_BUILD_ICEORYX2_TARGETS=OFF
          -DPOC_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: cmake --build _build/poc-tests --parallel 2

      - name: Test
        run: ctest --test-dir _build/poc-tests --output-on-failure

  release-readiness:
    name: Package consumer and benchmark smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++-13 libboost1.83-dev ninja-build

      - name: Install package
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B _build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/_install/package" \
            -DMULTI_INDEX_LRU_BUILD_TESTS=OFF \
            -DMULTI_INDEX_LRU_BUILD_EXAMPLES=OFF \
            -DMULTI_INDEX_LRU_BUILD_BENCHMARKS=OFF
          cmake --build _build/release
          cmake --install _build/release

      - name: Build and run downstream consumer
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S test/package_consumer -B _build/consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_install/package" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build _build/consumer --parallel 2
          _build/consumer/package_consumer

      - name: Build release archive
        run: |
          cpack --config _build/release/CPackConfig.cmake -B _packages
          test "$(find _packages -maxdepth 1 -name 'multi_index_lru-*.tar.gz' | wc -l)" -eq 1

      - name: Build and smoke-test benchmarks
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B _build/benchmark -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMULTI_INDEX_LRU_BUILD_TESTS=OFF \
            -DMULTI_INDEX_LRU_BUILD_EXAMPLES=OFF \
            -DMULTI_INDEX_LRU_BUILD_BENCHMARKS=ON
          cmake --build _build/benchmark --target multi_index_lru_benchmark --parallel 2
          _build/benchmark/benchmark/multi_index_lru_benchmark \
            --benchmark_filter='BM_InsertEvictWithPool/1024$' \
            --benchmark_min_time=0.01s
